server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Markdown files — serve as plain text
    location ~* \.md$ {
        default_type text/plain;
        try_files $uri =404;
    }

    # Static assets — serve directly, 404 on miss
    location ^~ /assets/ {
        try_files $uri =404;
    }

    # Design static files (html previews, images)
    location ^~ /designs/ {
        try_files $uri =404;
    }

    # Root homepage
    location = / {
        try_files /index.html;
    }

    # Valid SPA routes only — known slugs with optional locale prefix
    # Rejects unknown paths with 404 (allows ingress-level rate limiting)
    location ~ ^/(en/|zh/)?(claude|cohere|composio|cursor|elevenlabs|lovable|minimax|mistral\.ai|ollama|opencode\.ai|together\.ai|x\.ai|expo|framer|hashicorp|linear\.app|mintlify|raycast|warp|clickhouse|mongodb|posthog|replicate|resend|runwayml|sanity|supabase|airtable|cal|intercom|miro|notion|superhuman|zapier|clay|figma|ibm|sentry|vercel|voltagent|webflow|binance|coinbase|kraken|revolut|stripe|wise|airbnb|pinterest|shopify|uber|apple|meta|nike|playstation|spotify|theverge|wired|nvidia|bmw|bugatti|ferrari|lamborghini|renault|spacex|tesla)$ {
        try_files $uri /index.html;
    }

    # Locale roots: /en, /zh
    location ~ ^/(en|zh)$ {
        try_files /index.html;
    }

    # Everything else — reject with 404
    location / {
        return 404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;
}
